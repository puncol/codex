name: codex-core rollback regression

on:
  push:
    branches:
      - agent/fix-rollback-compaction-reconstruction
    paths:
      - codex-rs/core/**
      - .github/workflows/codex-core-rollback-regression.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Rollback after in-turn compaction
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        working-directory: codex-rs
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-ci
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
      - uses: taiki-e/install-action@44c6d64aa62cd779e873306675c7a58e86d6d532 # v2.62.49
        with:
          tool: nextest
          version: 0.9.103
      - name: Enable unprivileged user namespaces
        run: |
          sudo sysctl -w kernel.unprivileged_userns_clone=1
          if sudo sysctl -a 2>/dev/null | grep -q '^kernel.apparmor_restrict_unprivileged_userns'; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - name: Run rollback regression
        env:
          CARGO_INCREMENTAL: "0"
        run: just test -p codex-core --test all rollback_turn_with_auto_compaction_restores_pre_turn_history
